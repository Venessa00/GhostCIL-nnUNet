name: tests

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - name: Module smoke tests
        run: python tests/test_modules_cpu.py
      - name: Mixed-precision loss check (CPU fallback)
        run: python tests/test_loss_amp_gpu.py
      - name: Trainer registration
        run: python scripts/install_trainers.py
      - name: Data conversion and label audit on synthetic data
        run: |
          export nnUNet_raw=$PWD/nnUNet_raw nnUNet_preprocessed=$PWD/nnUNet_preprocessed nnUNet_results=$PWD/nnUNet_results
          mkdir -p $nnUNet_raw $nnUNet_preprocessed $nnUNet_results
          python tests/make_synthetic_ctscope.py --out ./synthetic_ct --size 64 --slices 2
          python scripts/prepare_data.py --src ./synthetic_ct
          python scripts/check_labels.py
